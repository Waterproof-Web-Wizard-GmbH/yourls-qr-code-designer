name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run against the latest YOURLS code, catches breaking core changes early
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  js:
    name: Lint, vendor check, JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: JavaScript syntax
        run: node --check assets/admin.js && node --check assets/qrcd-core.js
      - name: Bundled libraries match their npm releases
        run: npm run check:vendor
      - name: Core tests (render, place logo, decode)
        run: npm test
      - name: Translations compile and the .mo is up to date
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext >/dev/null
          msgfmt --check -o /tmp/de.mo languages/qr-code-designer-de_DE.po
          diff <(msgunfmt languages/qr-code-designer-de_DE.mo) <(msgunfmt /tmp/de.mo)

  php:
    name: PHP ${{ matrix.php }} / YOURLS ${{ matrix.yourls }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
        yourls: ['1.10.6', 'master']
    services:
      mysql:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, zip, dom, simplexml, intl, pdo_mysql
          # The test suite discovers test-*.php files, which PHPUnit 10+ no longer accepts
          tools: phpunit:9.6
      - name: PHP syntax
        run: find . -name '*.php' -not -path './test-suite/*' -print0 | xargs -0 -n1 php -l
      - name: Install the YOURLS test suite for plugins
        run: |
          git clone --depth 1 https://github.com/YOURLS/YOURLS-test-suite-for-plugins test-suite
          bash test-suite/src/install-test-suite.sh yourls_tests root '' 127.0.0.1 ${{ matrix.yourls }}
      - name: Run the tests
        run: phpunit -c ./test-suite/src/phpunit.xml --testdox
      - uses: actions/setup-node@v4
        if: matrix.php == '8.3' && matrix.yourls == '1.10.6'
        with:
          node-version: '22'
          cache: npm
      - name: Smoke test of the real admin page in jsdom
        if: matrix.php == '8.3' && matrix.yourls == '1.10.6'
        run: |
          npm ci --no-audit --no-fund
          php tests/smoke/render-page.php
          node tests/smoke/admin-smoke.mjs .
